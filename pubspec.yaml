name: car_rent_manager
description: Vehicle Rental Management App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3

  # Navigation
  go_router: ^13.0.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Image Picker & File Picker
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1

  # OCR: Android = ML Kit; Windows / iOS / macOS = platform_ocr (native OS)
  google_mlkit_text_recognition: ^0.13.0
  platform_ocr: ^1.0.0

  # Document text extraction
  pdf_text_extract: ^0.0.1
  docx_to_text: ^1.0.0

  # Crypto for License
  crypto: ^3.0.7

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

