name: car_rent_manager
description: Vehicle Rental Management App
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.8.3
  archive: 3.6.1

  # Navigation
  go_router: ^13.0.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

  # Notifications
  # AndroidDailyReminder uses this version's native date-anchored daily repeat.
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.2

  # Image Picker & File Picker
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1

  # OCR: on-device native engines (ML Kit / Apple Vision / WinRT).
  # Pinned: 0.3.x calls Color.withValues(), which needs Flutter >= 3.27
  # despite the package declaring >= 3.19. Unpin after upgrading Flutter.
  flutter_ocr_native: 0.2.1

  # Document text extraction
  syncfusion_flutter_pdf: ^24.0.0
  docx_to_text: ^1.0.0

  # Crypto for License
  crypto: ^3.0.7

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  uuid: ^4.3.3
  camera: ^0.11.0+2
  camera_windows: ^0.2.6+2
  camera_macos: ^0.0.9

  # UX & Aesthetics
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  animations: ^2.0.11
  fast_rsa: ^3.6.6
  device_info_plus: ^11.3.0
  # Settings.Secure.ANDROID_ID - device_info_plus exposes no per-device id
  android_id: ^0.5.2
  package_info_plus: ^9.0.1
  local_auth: ^3.0.2
  flutter_timezone: ^5.1.0
  llama_flutter_android: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo_new.png
    - assets/backgrounds/
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

# Launcher icons. Regenerate after changing the source art with:
#   dart run flutter_launcher_icons
#
# Android only for now, to keep regeneration fast. Re-enable ios/macos/windows
# here when those platforms are being packaged.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Android 8+ masks the icon to the launcher's shape, so the artwork sits
  # inset inside icon_foreground.png and the surround is a flat colour.
  adaptive_icon_background: "#010204"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  ios: false
